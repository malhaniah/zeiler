name: website

# The download website in website/ only: the app's CI (ci.yml) doesn't run for it,
# and this doesn't run for the app. On main it also publishes the site to GitHub Pages
# (Settings → Pages → Source: GitHub Actions; the custom domain is set there too). A new
# release needs no deploy: the pages swap in the live release in the browser.
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:

concurrency:
  group: website-${{ github.ref }}
  # a newer push never cancels a run that may be publishing
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm test
      # typechecks, then builds with the live release (the token lifts the API's
      # anonymous rate limit; without the API the build uses release-snapshot.json)
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: website/dist
          retention-days: 7
      # the Pages copy, for the deploy job below (not on pull requests)
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    # main only (a manual run can be started on any branch)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deploy at a time, and a newer one never cancels one that is publishing
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
